[project]
name = "sla-credit"
version = "0.1.0"
description = "Monthly SLA service-credit calculator: LLM reads, code decides."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sla_credit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
